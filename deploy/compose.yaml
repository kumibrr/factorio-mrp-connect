services:
  db:
    image: ${POSTGRES_IMAGE:?source deploy/versions.env}
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set local PostgreSQL password}
      POSTGRES_DB: postgres
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U odoo -d postgres']
      interval: 2s
      retries: 30
  odoo:
    image: ${ODOO_IMAGE:?source deploy/versions.env}
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD:?set local PostgreSQL password}
    ports:
      - '127.0.0.1:${ODOO_HTTP_PORT:-8069}:8069'
    volumes:
      - odoo-data:/var/lib/odoo
      - ../odoo-addons:/mnt/extra-addons:ro
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
    command: ['odoo', '-d', '${ODOO_DATABASE:-factorio_demo}']
networks:
  default:
    ipam:
      config:
        - subnet: ${ODOO_SUBNET:-172.28.0.0/24}
          gateway: ${ODOO_GATEWAY:-172.28.0.1}
volumes:
  database:
  odoo-data:
